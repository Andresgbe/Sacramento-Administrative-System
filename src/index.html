<!doctype html>
<!-- lang="es" + translate="no": with lang="en" Chrome offered to translate the
     page, and Google Translate swaps text nodes for its own copies — Angular
     keeps updating the originals, so every figure froze on filter changes. -->
<html lang="es" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <title>CC Sacramento</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet"
  >
</head>
<!-- Belt and braces for translators that ignore the attribute but honour the
     class (Microsoft Translator in Edge, translation extensions). -->
<body class="notranslate">
  <app-root></app-root>
</body>
</html>
