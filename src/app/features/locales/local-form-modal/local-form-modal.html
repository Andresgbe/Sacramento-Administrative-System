<div
  class="modal-backdrop"
  (mousedown)="onBackdropMouseDown($event)"
  (click)="onBackdropClick($event)"
>
  <div class="modal">
    <div class="modal__header">
      <h2>Agregar local</h2>
      <button type="button" class="modal__close" (click)="closed.emit()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="modal__form">
      <label
        class="field"
        [class.field--invalid]="form.controls.empresaId.invalid && form.controls.empresaId.touched"
      >
        <span>Empresa</span>
        <select formControlName="empresaId">
          <option value="" disabled>Selecciona una empresa</option>
          @for (empresa of empresas; track empresa.id) {
            <option [value]="empresa.id">{{ empresa.nombreComercial }}</option>
          }
        </select>
        @if (empresas.length === 0) {
          <span class="field__error"> Primero registra una empresa en la pestaña "Empresas". </span>
        } @else if (form.controls.empresaId.invalid && form.controls.empresaId.touched) {
          <span class="field__error">Debes seleccionar una empresa.</span>
        }
      </label>

      <label
        class="field"
        [class.field--invalid]="
          form.controls.numeroLocal.invalid && form.controls.numeroLocal.touched
        "
      >
        <span>Número de local</span>
        <input type="text" formControlName="numeroLocal" placeholder="PB-D" />
        @if (form.controls.numeroLocal.invalid && form.controls.numeroLocal.touched) {
          <span class="field__error">Este campo es obligatorio.</span>
        }
      </label>

      <div class="field-row">
        <label class="field">
          <span>Piso</span>
          <input type="text" formControlName="piso" placeholder="PB" />
        </label>

        <label class="field">
          <span>Monto de alquiler (USD)</span>
          <input
            type="number"
            formControlName="montoAlquiler"
            min="0"
            step="0.01"
            appSelectOnFocus
            appPositiveDecimal
          />
        </label>
      </div>

      @if (errorMessage) {
        <p class="modal__error">{{ errorMessage }}</p>
      }

      <div class="modal__actions">
        <button type="button" class="btn btn--secondary" (click)="closed.emit()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          @if (saving) {
            <span class="spinner"></span>
          }
          {{ saving ? 'Guardando…' : 'Guardar local' }}
        </button>
      </div>
    </form>
  </div>
</div>
