<div
  class="modal-backdrop"
  (mousedown)="onBackdropMouseDown($event)"
  (click)="onBackdropClick($event)"
>
  <div class="modal">
    <div class="modal__header">
      <h2>{{ egreso ? 'Editar gasto' : 'Registrar gasto' }}</h2>
      <button type="button" class="modal__close" (click)="closed.emit()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="modal__form">
      <label class="field">
        <span>Categoría</span>
        <select formControlName="categoria">
          <option value="administrativo">Gastos administrativos</option>
          <option value="operativo">Gastos operativos</option>
          <option value="remodelacion">Remodelación</option>
        </select>
      </label>

      <div class="field-row">
        <label class="field">
          <span>Fecha</span>
          <input type="date" formControlName="fecha" />
        </label>

        <label class="field">
          <span>Monto (USDT/Cash)</span>
          <input
            type="number"
            formControlName="monto"
            min="0"
            step="0.01"
            appSelectOnFocus
            appPositiveDecimal
          />
        </label>
      </div>

      <label class="field">
        <span>Descripción</span>
        <textarea formControlName="descripcion" placeholder="Opcional" rows="4"></textarea>
      </label>

      <div class="field">
        <span>Comprobante</span>

        <!-- Single file: `egresos` holds one `comprobante_ruta`, so there is
             nowhere to put a second. Same visual pattern either way. -->
        <label class="upload-zone">
          <input
            type="file"
            accept="image/*,.pdf"
            (change)="onComprobanteSelected($event)"
            hidden
          />
          <span class="upload-zone__icon" aria-hidden="true">&#128228;</span>
          <span class="upload-zone__title">Subir comprobante</span>
          <span class="upload-zone__hint">Imagen o PDF del gasto</span>
        </label>

        @if (comprobanteDisplayName) {
          <ul class="upload-list">
            <li class="upload-list__item" [class.upload-list__item--nuevo]="comprobanteFile">
              <span class="upload-list__name">{{ comprobanteDisplayName }}</span>
              @if (comprobanteFile) {
                <span class="upload-list__badge">Nuevo</span>
              }
              <button
                type="button"
                class="upload-list__remove"
                (click)="removeComprobante()"
                [attr.aria-label]="'Quitar ' + comprobanteDisplayName"
              >
                &#10005;
              </button>
            </li>
          </ul>
        }
      </div>

      @if (errorMessage) {
        <p class="modal__error">{{ errorMessage }}</p>
      }

      <div class="modal__actions">
        <button type="button" class="btn btn--secondary" (click)="closed.emit()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          @if (saving) {
            <span class="spinner"></span>
          }
          {{ saving ? 'Guardando…' : egreso ? 'Guardar cambios' : 'Registrar gasto' }}
        </button>
      </div>
    </form>
  </div>
</div>
