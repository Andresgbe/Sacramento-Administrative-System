<div class="modal-backdrop" (mousedown)="onBackdropMouseDown($event)" (click)="onBackdropClick($event)">
  <div class="modal">
    <div class="modal__header">
      <h2>Registrar gasto</h2>
      <button type="button" class="modal__close" (click)="closed.emit()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="modal__form">
      <label class="field">
        <span>Categoría</span>
        <select formControlName="categoria">
          <option value="administrativo">Gastos administrativos</option>
          <option value="operativo">Gastos operativos</option>
        </select>
      </label>

      <div class="field-row">
        <label class="field">
          <span>Fecha</span>
          <input type="date" formControlName="fecha" />
        </label>

        <label class="field">
          <span>Monto (USD)</span>
          <input type="number" formControlName="monto" min="0" step="0.01" />
        </label>
      </div>

      <label class="field">
        <span>Descripción</span>
        <input type="text" formControlName="descripcion" placeholder="Opcional" />
      </label>

      @if (errorMessage) {
        <p class="modal__error">{{ errorMessage }}</p>
      }

      <div class="modal__actions">
        <button type="button" class="btn btn--secondary" (click)="closed.emit()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          {{ saving ? 'Guardando…' : 'Registrar gasto' }}
        </button>
      </div>
    </form>
  </div>
</div>
