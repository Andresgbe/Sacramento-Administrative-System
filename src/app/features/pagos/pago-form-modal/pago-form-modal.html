<div class="modal-backdrop" (mousedown)="onBackdropMouseDown($event)" (click)="onBackdropClick($event)">
  <div class="modal">
    <div class="modal__header">
      <h2>{{ pago ? 'Editar pago' : 'Registrar pago' }}</h2>
      <button type="button" class="modal__close" (click)="closed.emit()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="modal__form">
      <label
        class="field"
        [class.field--invalid]="form.controls.localId.invalid && form.controls.localId.touched"
      >
        <span>Local</span>
        <select formControlName="localId">
          <option value="" disabled>Selecciona un local</option>
          @for (local of locales; track local.id) {
            <option [value]="local.id">{{ local.nombreComercial }}</option>
          }
        </select>
        @if (form.controls.localId.invalid && form.controls.localId.touched) {
          <span class="field__error">Debes seleccionar un local.</span>
        }
      </label>

      <div class="field-row">
        <label class="field">
          <span>Fecha</span>
          <input type="date" formControlName="fecha" />
        </label>

        <label
          class="field"
          [class.field--invalid]="form.controls.monto.invalid && form.controls.monto.touched"
        >
          <span>Monto (USD)</span>
          <input
            type="number"
            formControlName="monto"
            min="0"
            step="0.01"
            appSelectOnFocus
            appPositiveDecimal
          />
          @if (form.controls.monto.invalid && form.controls.monto.touched) {
            <span class="field__error">El monto no puede estar vacío.</span>
          }
        </label>
      </div>

      <label class="field">
        <span>Tasa</span>
        <select formControlName="tipoTasa">
          <option value="BCV">BCV</option>
          <option value="EUR">Euro</option>
          <option value="USD">USDT/Cash</option>
          <option value="otra">Otra</option>
        </select>
      </label>

      <label class="field">
        <span>Descripción</span>
        <textarea formControlName="descripcion" placeholder="Opcional" rows="4"></textarea>
      </label>

      <div class="field">
        <span>Comprobante de pago</span>
        @if (comprobanteDisplayName) {
          <div class="file-picker__selected">
            <span class="file-picker__name">{{ comprobanteDisplayName }}</span>
            @if (comprobanteFile) {
              <button type="button" class="file-picker__remove" (click)="removeComprobante()">
                Quitar
              </button>
            } @else {
              <label class="file-picker__remove">
                Reemplazar
                <input
                  type="file"
                  accept="image/*,.pdf"
                  (change)="onComprobanteSelected($event)"
                  hidden
                />
              </label>
            }
          </div>
        } @else {
          <label class="file-picker__dropzone">
            <input
              type="file"
              accept="image/*,.pdf"
              (change)="onComprobanteSelected($event)"
              hidden
            />
            Subir comprobante
          </label>
        }
      </div>

      @if (errorMessage) {
        <p class="modal__error">{{ errorMessage }}</p>
      }

      <div class="modal__actions">
        <button type="button" class="btn btn--secondary" (click)="closed.emit()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          @if (saving) {
            <span class="spinner"></span>
          }
          {{ saving ? 'Guardando…' : pago ? 'Guardar cambios' : 'Registrar pago' }}
        </button>
      </div>
    </form>
  </div>
</div>
