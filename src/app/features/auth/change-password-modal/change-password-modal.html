<div class="modal-backdrop" (mousedown)="onBackdropMouseDown($event)" (click)="onBackdropClick($event)">
  <div class="modal">
    <div class="modal__header">
      <h2>Cambiar contraseña</h2>
      <button type="button" class="modal__close" (click)="closed.emit()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <p class="modal__hint">Actualiza la contraseña de tu cuenta.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="modal__form">
      <label class="field">
        <span>Contraseña actual</span>
        <input type="password" formControlName="currentPassword" placeholder="Tu contraseña actual" />
      </label>

      <label class="field">
        <span>Contraseña nueva</span>
        <input type="password" formControlName="newPassword" placeholder="Mínimo 6 caracteres" />
      </label>

      <label class="field">
        <span>Confirmar contraseña nueva</span>
        <input type="password" formControlName="confirmPassword" placeholder="Repite la contraseña nueva" />
      </label>

      @if (form.controls.confirmPassword.touched && passwordsMismatch()) {
        <p class="modal__error">Las contraseñas nuevas no coinciden.</p>
      }

      @if (errorMessage) {
        <p class="modal__error">{{ errorMessage }}</p>
      }

      <div class="modal__actions">
        <button type="button" class="btn btn--secondary" (click)="closed.emit()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          @if (saving) {
            <span class="spinner"></span>
          }
          {{ saving ? 'Guardando…' : 'Cambiar contraseña' }}
        </button>
      </div>
    </form>
  </div>
</div>
