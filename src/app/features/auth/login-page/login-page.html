<div class="login">
  <form [formGroup]="form" (ngSubmit)="submit()" class="login__card">
    <div class="login__brand">
      <img class="login__logo" src="/images/logo-completo.jpg" alt="Inmobiliaria Di Placido C.A." />
    </div>
    <p class="login__subtitle">Inicia sesión para continuar</p>

    <label class="field">
      <span>Correo electrónico</span>
      <input
        type="email"
        name="email"
        autocomplete="username"
        formControlName="email"
        placeholder="tucorreo@gmail.com"
      />
    </label>

    <label class="field">
      <span>Contraseña</span>
      <span class="login__password">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          autocomplete="current-password"
          formControlName="password"
          placeholder="••••••••"
        />
        <button
          type="button"
          class="login__eye"
          (click)="toggleShowPassword()"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [title]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <path d="M1 1l22 22" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </span>
    </label>

    <label class="login__remember">
      <input
        type="checkbox"
        [checked]="savePassword()"
        (change)="setSavePassword($any($event.target).checked)"
      />
      <span>Guardar contraseña en este navegador</span>
    </label>

    @if (errorMessage()) {
      <p class="login__error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn btn--primary login__submit" [disabled]="submitting()">
      {{ submitting() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</div>
