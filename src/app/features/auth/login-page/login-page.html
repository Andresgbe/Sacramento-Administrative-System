<div class="login">
  <form [formGroup]="form" (ngSubmit)="submit()" class="login__card">
    <div class="login__brand">
      <img class="login__logo" src="/images/logo.jpg" alt="Centro Comercial Sacramento" />
    </div>
    <p class="login__subtitle">Inicia sesión para continuar</p>

    <label class="field">
      <span>Correo electrónico</span>
      <input type="email" formControlName="email" placeholder="tucorreo@gmail.com" />
    </label>

    <label class="field">
      <span>Contraseña</span>
      <input type="password" formControlName="password" placeholder="••••••••" />
    </label>

    @if (errorMessage()) {
      <p class="login__error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn btn--primary login__submit" [disabled]="submitting()">
      {{ submitting() ? 'Ingresando…' : 'Ingresar' }}
    </button>

    <button
      type="button"
      class="btn btn--secondary login__quick"
      [disabled]="submitting()"
      (click)="quickLogin()"
    >
      Acceso rápido
    </button>
  </form>
</div>
