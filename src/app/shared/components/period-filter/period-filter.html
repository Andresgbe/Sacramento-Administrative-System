<!-- min/max keep the calendar from picking an end before the start. -->
<label class="filters-field">
  <span>Fecha inicio</span>
  <input
    type="date"
    [ngModel]="inicio()"
    [attr.max]="fin() || null"
    (ngModelChange)="inicioChange.emit($event)"
  />
</label>

<label class="filters-field">
  <span>Fecha final</span>
  <input
    type="date"
    [ngModel]="fin()"
    [attr.min]="inicio() || null"
    (ngModelChange)="finChange.emit($event)"
  />
</label>
