<label class="filters-field">
  <span>Año</span>
  <select [ngModel]="anio()" (ngModelChange)="onAnio($event)">
    <option value="">Todos</option>
    @for (year of anios(); track year) {
      <option [value]="year">{{ year }}</option>
    }
  </select>
</label>

<label class="filters-field">
  <span>Mes</span>
  <select [ngModel]="mes()" (ngModelChange)="onMes($event)">
    <option value="">Todos</option>
    @for (m of meses; track m.value) {
      <option [value]="m.value">{{ m.label }}</option>
    }
  </select>
</label>
