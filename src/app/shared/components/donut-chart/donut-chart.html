<div class="donut">
  <div class="donut__ring-wrapper">
    <svg viewBox="0 0 160 160" class="donut__svg">
      <g transform="rotate(-90 80 80)">
        <circle
          cx="80"
          cy="80"
          [attr.r]="radius"
          fill="none"
          stroke="var(--color-border)"
          [attr.stroke-width]="strokeWidth"
        />
        @for (segment of computedSegments(); track segment.label; let i = $index) {
          <circle
            cx="80"
            cy="80"
            [attr.r]="radius"
            fill="none"
            [attr.stroke]="segment.color"
            [attr.stroke-width]="hoveredIndex() === i ? strokeWidth + 4 : strokeWidth"
            stroke-linecap="round"
            [attr.stroke-dasharray]="segment.dashArray"
            [attr.stroke-dashoffset]="segment.dashOffset"
            class="donut__segment"
            (pointerenter)="onHover(i)"
            (pointerleave)="onLeave()"
          />
        }
      </g>
    </svg>

    <div class="donut__center">
      <span class="donut__center-value">{{ total() }}</span>
      <span class="donut__center-label">{{ centerLabel }}</span>
    </div>

    @if (hoveredSegment(); as tooltip) {
      <div class="donut__tooltip">
        {{ tooltip.label }}: {{ tooltip.value }} ({{ tooltip.percentage }}%)
      </div>
    }
  </div>

  <ul class="donut__legend">
    @for (segment of computedSegments(); track segment.label) {
      <li class="donut__legend-item">
        <span class="donut__legend-dot" [style.background]="segment.color"></span>
        <span class="donut__legend-label">{{ segment.label }}</span>
        <span class="donut__legend-value">{{ segment.value }}</span>
      </li>
    }
  </ul>
</div>
