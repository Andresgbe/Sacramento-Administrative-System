<div
  class="modal-backdrop"
  (mousedown)="onBackdropMouseDown($event)"
  (click)="onBackdropClick($event)"
>
  <div class="modal">
    <div class="modal__header">
      <h2>Comprobante de pago</h2>
      <button type="button" class="modal__close" (click)="closed.emit()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <p class="modal__filename">{{ nombreArchivo }}</p>

    <div class="modal__preview">
      @if (loading) {
        <p class="modal__status">Cargando comprobante…</p>
      } @else if (errorMessage) {
        <p class="modal__status modal__status--error">{{ errorMessage }}</p>
      } @else if (url) {
        @if (isImage) {
          <img [src]="url" [alt]="nombreArchivo" />
        } @else if (isPdf) {
          <iframe [src]="safePdfUrl" title="Comprobante de pago"></iframe>
        } @else {
          <p class="modal__status">No hay vista previa disponible para este tipo de archivo.</p>
        }
      }
    </div>

    <div class="modal__actions">
      <button type="button" class="btn btn--secondary" (click)="closed.emit()">Cerrar</button>
      @if (url) {
        <a
          class="btn btn--primary"
          [href]="url"
          [download]="nombreArchivo"
          target="_blank"
          rel="noopener"
        >
          Descargar
        </a>
      }
    </div>
  </div>
</div>
