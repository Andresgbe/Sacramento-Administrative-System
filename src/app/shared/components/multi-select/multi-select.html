<div class="multi-select">
  <button
    type="button"
    class="multi-select__trigger"
    [attr.aria-expanded]="open()"
    (click)="toggleMenu()"
  >
    <span class="multi-select__value">{{ triggerLabel() }}</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (open()) {
    <div class="multi-select__backdrop" (click)="closeMenu()"></div>
    <div class="multi-select__panel">
      @for (option of options(); track option.id) {
        <label class="multi-select__option">
          <input
            type="checkbox"
            [checked]="isSelected(option.id)"
            (change)="toggleOption(option.id)"
          />
          {{ option.label }}
        </label>
      } @empty {
        <p class="multi-select__empty">No hay opciones disponibles.</p>
      }

      @if (selected().size > 0) {
        <button type="button" class="multi-select__clear" (click)="clear()">
          Limpiar selección
        </button>
      }
    </div>
  }
</div>
