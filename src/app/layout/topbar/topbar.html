<header class="topbar">
  <button
    type="button"
    class="topbar__menu-toggle"
    (click)="menuToggle.emit()"
    aria-label="Abrir menú"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
    </svg>
  </button>

  <div class="topbar__title">
    <h1>{{ pageHeader.current().title }}</h1>
    @if (pageHeader.current().subtitle) {
      <p>{{ pageHeader.current().subtitle }}</p>
    }
  </div>

  <button
    type="button"
    class="topbar__eye"
    (click)="amountVisibility.toggle()"
    [attr.aria-pressed]="amountVisibility.hidden()"
    [attr.aria-label]="amountVisibility.hidden() ? 'Mostrar montos' : 'Ocultar montos'"
    [title]="amountVisibility.hidden() ? 'Mostrar montos' : 'Ocultar montos'"
  >
    @if (amountVisibility.hidden()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
        <path d="M1 1l22 22" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>

  <div class="topbar__profile">
    <button
      type="button"
      class="topbar__avatar"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
    >
      {{ userInitials() }}
    </button>

    @if (menuOpen()) {
      <div class="topbar__menu">
        <div class="topbar__menu-header">{{ userName() }}</div>
        <button type="button" class="topbar__menu-item" (click)="closeMenu()">
          Mi información
        </button>
        <button type="button" class="topbar__menu-item" (click)="openPasswordModal()">
          Cambiar contraseña
        </button>
        <button
          type="button"
          class="topbar__menu-item topbar__menu-item--danger"
          (click)="logOut()"
        >
          Cerrar sesión
        </button>
      </div>
    }
  </div>
</header>

@if (passwordModalOpen()) {
  <app-change-password-modal
    [saving]="passwordSaving()"
    [errorMessage]="passwordError()"
    (closed)="closePasswordModal()"
    (saved)="onPasswordSaved($event)"
  />
}
